<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
<header class="site-header">
  <a routerLink="/inscricoes" class="brand" aria-label="Corrida Solidária — inscrições">
    <span class="brand-icon" aria-hidden="true"
      ><svg viewBox="0 0 24 24">
        <path
          d="M20 5.5c-2.5-2.5-6-1.7-8 .6-2-2.3-5.5-3.1-8-.6-3.6 3.6.1 8.9 8 14 7.9-5.1 11.6-10.4 8-14Z"
        />
        <path d="M5 11h4l1.5-3 3 6L15 11h4" /></svg
    ></span>
    <span
      >{{ evento.nome }} <span class="community">· {{ evento.comunidade }}</span></span
    >
  </a>
  <span class="total badge"
    ><svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="9" cy="7" r="3" />
      <path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5" /></svg
    >Inscritos: <strong>{{ dados.contadores().total }}</strong></span
  >
</header>
<main id="conteudo" tabindex="-1"><router-outlet /></main>
